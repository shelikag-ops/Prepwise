<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Meal Prep Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --saffron: #E8820C;
    --saffron-light: #FFF3E0;
    --saffron-glow: rgba(232,130,12,0.12);
    --deep: #1A1208;
    --mid: #3D2B1A;
    --cream: #FDF8F2;
    --card-bg: #FFFDF9;
    --text: #2C1A0E;
    --muted: #8B6E52;
    --border: rgba(232,130,12,0.2);
    --green: #2D6A4F;
    --green-light: #E8F5EE;
    --comfort: #C0392B;
    --comfort-light: #FDEDEC;
    --eatout: #1565C0;
    --eatout-light: #E3F2FD;
    --step-done: #95A5A6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── BACKGROUND TEXTURE ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: 
      radial-gradient(ellipse 80% 50% at 20% 10%, rgba(232,130,12,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 90%, rgba(232,130,12,0.04) 0%, transparent 50%);
    pointer-events: none; z-index: 0;
  }

  /* ── HEADER ── */
  .header {
    background: var(--deep);
    padding: 0;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  }

  .header-inner {
    max-width: 1100px; margin: 0 auto;
    padding: 14px 24px;
    display: flex; align-items: center; gap: 20px;
    flex-wrap: wrap;
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-weight: 900; font-size: 22px;
    color: var(--saffron);
    letter-spacing: -0.5px;
    flex-shrink: 0;
  }

  .logo span { color: #FDF8F2; font-weight: 400; }

  /* DAY TABS */
  .day-tabs {
    display: flex; gap: 4px; flex-wrap: wrap; flex: 1;
  }

  .day-tab {
    padding: 7px 16px; border-radius: 20px;
    border: 1.5px solid rgba(232,130,12,0.3);
    background: transparent;
    color: rgba(253,248,242,0.6);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .day-tab:hover { border-color: var(--saffron); color: var(--saffron); }
  .day-tab.active {
    background: var(--saffron); border-color: var(--saffron);
    color: white; font-weight: 600;
  }

  /* TIME TOGGLE */
  .time-toggle {
    display: flex; gap: 4px; margin-left: auto;
    flex-shrink: 0;
  }

  .time-btn {
    padding: 6px 14px; border-radius: 20px;
    border: 1.5px solid rgba(253,248,242,0.2);
    background: transparent;
    color: rgba(253,248,242,0.5);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all 0.2s;
  }

  .time-btn.active {
    background: rgba(253,248,242,0.1);
    border-color: rgba(253,248,242,0.4);
    color: #FDF8F2;
  }

  /* ── MAIN LAYOUT ── */
  .main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; position: relative; z-index: 1; }

  /* ── DAY HEADER ── */
  .day-title-bar {
    display: flex; align-items: baseline; gap: 16px;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--border);
  }

  .day-title {
    font-family: 'Playfair Display', serif;
    font-size: 38px; font-weight: 900;
    color: var(--saffron);
    line-height: 1;
  }

  .day-subtitle {
    font-size: 14px; color: var(--muted);
    font-weight: 400;
  }

  .progress-ring {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--muted);
  }

  .progress-bar {
    width: 120px; height: 6px;
    background: var(--border);
    border-radius: 3px; overflow: hidden;
  }

  .progress-fill {
    height: 100%; background: var(--saffron);
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  /* ── MEAL CARDS GRID ── */
  .meals-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
  }

  /* ── MEAL CARD ── */
  .meal-card {
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: box-shadow 0.25s, transform 0.2s;
    display: flex; flex-direction: column;
  }

  .meal-card:hover {
    box-shadow: 0 8px 32px rgba(232,130,12,0.12);
    transform: translateY(-2px);
  }

  .meal-card.comfort { border-color: rgba(192,57,43,0.3); }
  .meal-card.eat-out { border-color: rgba(21,101,192,0.3); }

  /* Card header */
  .card-header {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, var(--saffron-glow), transparent);
    cursor: pointer;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  }

  .meal-card.comfort .card-header { background: linear-gradient(135deg, rgba(192,57,43,0.06), transparent); }
  .meal-card.eat-out .card-header { background: linear-gradient(135deg, rgba(21,101,192,0.06), transparent); }

  .meal-time {
    font-size: 11px; font-weight: 600; letter-spacing: 0.8px;
    text-transform: uppercase; color: var(--saffron); margin-bottom: 4px;
  }

  .meal-card.comfort .meal-time { color: var(--comfort); }
  .meal-card.eat-out .meal-time { color: var(--eatout); }

  .meal-name {
    font-family: 'Playfair Display', serif;
    font-size: 17px; font-weight: 700;
    color: var(--text); line-height: 1.3;
  }

  .card-chevron {
    font-size: 18px; color: var(--muted);
    transition: transform 0.25s; flex-shrink: 0;
    margin-top: 2px;
  }

  .meal-card.open .card-chevron { transform: rotate(180deg); }

  /* Card body */
  .card-body {
    display: none; flex-direction: column;
    flex: 1;
  }

  .meal-card.open .card-body { display: flex; }

  /* Tabs inside card */
  .card-tabs {
    display: flex; border-bottom: 1px solid var(--border);
    background: rgba(232,130,12,0.03);
  }

  .card-tab {
    flex: 1; padding: 9px 8px;
    font-size: 11px; font-weight: 600;
    text-align: center; text-transform: uppercase;
    letter-spacing: 0.5px; color: var(--muted);
    cursor: pointer; border: none; background: none;
    transition: all 0.2s;
    border-bottom: 2px solid transparent;
  }

  .card-tab.active {
    color: var(--saffron);
    border-bottom-color: var(--saffron);
    background: rgba(232,130,12,0.05);
  }

  .meal-card.comfort .card-tab.active { color: var(--comfort); border-bottom-color: var(--comfort); }
  .meal-card.eat-out .card-tab.active { color: var(--eatout); border-bottom-color: var(--eatout); }

  /* Tab panels */
  .tab-panel { display: none; padding: 16px 18px; flex: 1; }
  .tab-panel.active { display: block; }

  /* Dish description */
  .dish-desc {
    font-size: 14px; line-height: 1.65; color: var(--text);
    white-space: pre-line;
  }

  .dish-desc .macro-line {
    display: inline-block; margin-top: 8px;
    background: var(--saffron-light);
    color: var(--saffron); font-weight: 600;
    font-size: 12px; padding: 3px 10px; border-radius: 20px;
  }

  /* Kids banner */
  .kids-section {
    background: var(--green-light);
    border-left: 3px solid var(--green);
    padding: 10px 14px; border-radius: 0 8px 8px 0;
    font-size: 13px; line-height: 1.55;
    color: #1a3d2b;
  }

  .kids-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.8px; color: var(--green); margin-bottom: 4px;
  }

  /* Prep steps */
  .steps-list { list-style: none; }

  .step-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(232,130,12,0.08);
    cursor: pointer; transition: opacity 0.2s;
  }

  .step-item:last-child { border-bottom: none; }
  .step-item.done { opacity: 0.45; }

  .step-num {
    width: 26px; height: 26px; flex-shrink: 0;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    background: var(--saffron-light); color: var(--saffron);
    transition: all 0.2s;
    border: 1.5px solid rgba(232,130,12,0.3);
  }

  .step-item.done .step-num {
    background: #eee; color: var(--step-done);
    border-color: #ddd;
    font-size: 14px;
  }

  .step-text {
    font-size: 14px; line-height: 1.55; color: var(--text);
    flex: 1; padding-top: 3px;
    transition: color 0.2s;
  }

  .step-item.done .step-text { text-decoration: line-through; color: var(--step-done); }

  /* Timer badge */
  .timer-badge {
    font-size: 11px; font-weight: 600;
    background: rgba(232,130,12,0.1); color: var(--saffron);
    padding: 2px 8px; border-radius: 10px;
    flex-shrink: 0; margin-top: 5px;
    display: flex; align-items: center; gap: 3px;
  }

  .comfort .timer-badge { background: rgba(192,57,43,0.1); color: var(--comfort); }

  /* Empty state */
  .no-steps {
    color: var(--muted); font-size: 13px;
    font-style: italic; padding: 8px 0;
    text-align: center;
  }

  /* Recipe link */
  .recipe-link {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 14px;
    padding: 8px 14px; border-radius: 8px;
    background: var(--saffron-light);
    color: var(--saffron); text-decoration: none;
    font-size: 12px; font-weight: 600;
    transition: all 0.2s;
    border: 1px solid rgba(232,130,12,0.2);
  }

  .recipe-link:hover { background: var(--saffron); color: white; }
  .meal-card.comfort .recipe-link { background: var(--comfort-light); color: var(--comfort); border-color: rgba(192,57,43,0.2); }
  .meal-card.comfort .recipe-link:hover { background: var(--comfort); color: white; }
  .meal-card.eat-out .recipe-link { background: var(--eatout-light); color: var(--eatout); border-color: rgba(21,101,192,0.2); }
  .meal-card.eat-out .recipe-link:hover { background: var(--eatout); color: white; }

  /* Special badges */
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.3px; margin-bottom: 6px;
  }

  .badge-comfort { background: var(--comfort-light); color: var(--comfort); }
  .badge-eatout { background: var(--eatout-light); color: var(--eatout); }

  /* PREP SUMMARY BAR */
  .prep-summary {
    background: var(--deep); color: #FDF8F2;
    border-radius: 14px; padding: 20px 24px;
    margin-bottom: 24px;
    display: flex; align-items: center; gap: 24px;
    flex-wrap: wrap;
  }

  .prep-label {
    font-family: 'Playfair Display', serif;
    font-size: 15px; font-weight: 700;
    color: var(--saffron);
  }

  .prep-stat {
    display: flex; flex-direction: column; align-items: center;
  }

  .prep-stat-num {
    font-size: 26px; font-weight: 700;
    color: white; line-height: 1;
  }

  .prep-stat-lbl {
    font-size: 11px; color: rgba(253,248,242,0.5);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-top: 2px;
  }

  .prep-divider { width: 1px; height: 36px; background: rgba(253,248,242,0.1); }

  /* QUICK CLEAR */
  .clear-btn {
    margin-left: auto;
    padding: 8px 18px; border-radius: 20px;
    border: 1.5px solid rgba(232,130,12,0.4);
    background: transparent; color: var(--saffron);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }

  .clear-btn:hover { background: var(--saffron); color: white; }

  /* FULL PREP MODE */
  .prep-mode-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 200;
    background: var(--deep);
    overflow-y: auto;
  }

  .prep-mode-overlay.show { display: flex; flex-direction: column; }

  .prep-mode-header {
    position: sticky; top: 0;
    background: var(--deep);
    padding: 20px 28px;
    display: flex; align-items: center; gap: 16px;
    border-bottom: 1px solid rgba(232,130,12,0.15);
    z-index: 10;
  }

  .prep-mode-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px; color: var(--saffron); font-weight: 700;
  }

  .prep-mode-close {
    margin-left: auto;
    background: none; border: 1.5px solid rgba(253,248,242,0.2);
    color: #FDF8F2; padding: 8px 18px; border-radius: 20px;
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    cursor: pointer; transition: all 0.2s;
  }

  .prep-mode-close:hover { background: rgba(253,248,242,0.1); }

  .prep-mode-body { padding: 28px; flex: 1; }

  .prep-mode-step {
    display: flex; align-items: flex-start; gap: 20px;
    padding: 20px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .prep-mode-step.done { opacity: 0.3; }

  .prep-mode-num {
    width: 44px; height: 44px; flex-shrink: 0;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700;
    background: var(--saffron-glow); color: var(--saffron);
    border: 2px solid var(--saffron);
    transition: all 0.2s;
  }

  .prep-mode-step.done .prep-mode-num {
    background: rgba(255,255,255,0.05);
    border-color: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.2);
    font-size: 22px;
  }

  .prep-mode-text {
    font-size: 22px; line-height: 1.5;
    color: rgba(253,248,242,0.9);
    transition: all 0.2s;
    padding-top: 8px;
  }

  .prep-mode-step.done .prep-mode-text {
    text-decoration: line-through;
    color: rgba(253,248,242,0.2);
  }

  /* EXPAND ALL */
  .expand-all-btn {
    padding: 8px 18px; border-radius: 20px;
    border: 1.5px solid var(--border);
    background: transparent; color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
    margin-bottom: 20px;
  }

  .expand-all-btn:hover { border-color: var(--saffron); color: var(--saffron); }

  /* KITCHEN MODE BTN */
  .kitchen-mode-btn {
    position: fixed; bottom: 28px; right: 28px;
    padding: 14px 22px; border-radius: 30px;
    background: var(--saffron);
    color: white; border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 700;
    cursor: pointer; z-index: 50;
    box-shadow: 0 4px 20px rgba(232,130,12,0.4);
    transition: all 0.2s;
    display: flex; align-items: center; gap: 8px;
  }

  .kitchen-mode-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(232,130,12,0.5);
  }

  /* ── FULL RECIPE PANEL ── */
  .recipe-panel { padding: 16px 18px 20px; }
  .recipe-panel-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 900; color: var(--text); line-height: 1.2; }
  .recipe-panel-subtitle { font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
  .recipe-meta { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0 14px; }
  .recipe-meta-chip { font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; background: var(--saffron-light); color: var(--saffron); border: 1px solid rgba(232,130,12,0.2); }
  .recipe-desc-text { font-size: 13px; line-height: 1.65; color: var(--muted); font-style: italic; margin-bottom: 14px; padding-left: 10px; border-left: 2px solid var(--border); }
  .recipe-section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--saffron); margin: 14px 0 8px; }
  .ingredient-group { margin-bottom: 10px; }
  .ingredient-group-name { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 4px; }
  .ingredient-list { list-style: none; }
  .ingredient-item { display: flex; align-items: baseline; gap: 8px; padding: 3px 0; border-bottom: 1px solid rgba(232,130,12,0.06); font-size: 13.5px; line-height: 1.5; color: var(--text); }
  .ingredient-item::before { content: '·'; color: var(--saffron); font-weight: 700; flex-shrink: 0; }
  .optional-group { opacity: 0.78; }
  .optional-group .ingredient-group-name { color: var(--green); }
  .method-steps { list-style: none; margin-top: 4px; }
  .method-step { display: flex; gap: 14px; padding: 11px 0; border-bottom: 1px solid rgba(232,130,12,0.08); }
  .method-step:last-child { border-bottom: none; }
  .method-step-num { width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; background: var(--saffron); color: white; margin-top: 1px; }
  .method-step-content { flex: 1; }
  .method-step-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
  .method-step-text { font-size: 13.5px; line-height: 1.6; color: #4a3020; }
  .method-step-timer { display: inline-flex; align-items: center; gap: 4px; margin-top: 5px; font-size: 11px; font-weight: 600; background: var(--saffron-light); color: var(--saffron); padding: 2px 9px; border-radius: 10px; }
  .texture-box { background: linear-gradient(135deg, var(--saffron-light), #fff8ed); border: 1px solid rgba(232,130,12,0.25); border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.55; color: var(--text); margin-top: 4px; }
  .serving-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .serving-tag { font-size: 12px; padding: 4px 12px; border-radius: 20px; background: var(--green-light); color: var(--green); border: 1px solid rgba(45,106,79,0.2); font-weight: 500; }

  /* ── SECTION HEADINGS ── */
  .section-heading {
    display: flex; align-items: center; gap: 10px;
    font-family: 'Playfair Display', serif;
    font-size: 18px; font-weight: 700; color: var(--text);
    margin-bottom: 16px;
  }
  .section-icon { font-size: 20px; }
  .section-for-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 600;
    color: var(--muted); margin-left: 4px;
  }

  /* ── EVE PREP PANEL ── */
  .eve-prep-panel {
    display: flex; flex-direction: column; gap: 16px;
    background: var(--deep);
    border-radius: 16px; padding: 20px 22px;
    margin-bottom: 40px;
  }

  .eve-section { }

  .eve-section-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.8px; color: rgba(232,130,12,0.7);
    margin-bottom: 10px;
  }

  .eve-icon { font-size: 14px; }

  .eve-prep-panel .step-item {
    border-bottom-color: rgba(255,255,255,0.06);
  }

  .eve-prep-panel .step-text { color: rgba(253,248,242,0.85); }
  .eve-prep-panel .step-item.done .step-text { color: rgba(253,248,242,0.25); }

  .eve-step-num {
    background: rgba(232,130,12,0.15) !important;
    border-color: rgba(232,130,12,0.3) !important;
    color: var(--saffron) !important;
  }

  .step-item.done .eve-step-num {
    background: rgba(255,255,255,0.05) !important;
    border-color: rgba(255,255,255,0.1) !important;
    color: rgba(255,255,255,0.2) !important;
  }

  .eve-tag {
    display: inline-block; margin-top: 4px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
    text-transform: uppercase; color: rgba(232,130,12,0.5);
    background: rgba(232,130,12,0.08);
    padding: 2px 8px; border-radius: 8px;
  }

  /* ── NUTRITION TAB ── */
  .nutrition-tab { background: linear-gradient(135deg, #e8f5e9, #f3e5f5) !important; }
  .nutrition-tab.active { background: linear-gradient(135deg, #2D6A4F, #7B5EA7) !important; color: white !important; }
  .nutrition-panel { padding: 4px 2px 8px; }
  .nutrition-disclaimer { font-size: 11px; color: #888; background: #fafafa; border-radius: 6px; padding: 7px 10px; margin-bottom: 12px; line-height: 1.5; border: 1px solid #eee; }
  .nutri-section-label { font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #999; margin-bottom: 6px; }
  .nutri-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .nutri-table th { font-size: 11px; font-weight: 600; color: #aaa; padding: 0 6px 6px; text-align: left; }
  .th-bar { width: 80px; }

const DAYS = [...new Set(MEAL_DATA.map(m => m.day))];
let activeDay = DAYS[0];
let doneSteps = {};
let openCards = {};
let activeCardTab = {};
let snackEdits = {}; // persists editable snack field changes in-session

function stepId(day, mealIdx, type, stepIdx) {
  return `${day}_${mealIdx}_${type}_${stepIdx}`;
}

function parseSteps(text) {
  if (!text || !text.trim()) return [];
  return text.split('\n').map(s => s.trim()).filter(s => s.length > 2);
}

function extractTime(step) {
  const m = step.match(/(\d+)\s*min/i);
  return m ? parseInt(m[1]) : null;
}

function getMealSlotType(meal) {
  const m = meal.toLowerCase();
  if (m.includes('comfort')) return 'comfort';
  if (m.includes('eat out')) return 'eat-out';
  if (m.includes('kids snack') || m.includes('morning snack')) return 'snack';
  return 'normal';
}

function getMealTimeLabel(meal) {
  if (meal.includes('10 AM')) return '10 AM';
  if (meal.includes('11:00')) return '11:00 AM';
  if (meal.includes('1:30')) return '1:30 PM';
  if (meal.includes('5:00')) return '5:00 PM';
  if (meal.includes('5:30')) return '5:30 PM';
  return meal.split(' ').slice(0,2).join(' ');
}

function getMealDisplayName(meal) {
  if (meal.includes('Breakfast')) return 'Breakfast';
  if (meal.includes('Morning Snack')) return 'Morning Snack';
  if (meal.includes('Lunch')) return 'Lunch';
  if (meal.includes('Kids Snack')) return 'Evening Snack';
  if (meal.includes('COMFORT')) return '✨ Comfort Evening';
  if (meal.includes('EAT OUT')) return '🍽 Eat Out';
  if (meal.includes('Evening')) return 'Evening';
  return meal;
}

function countStepsForDay(day) {
  const dayMeals = MEAL_DATA.filter(m => m.day === day);
  let total = 0, done = 0;
  // Count morning steps per meal
  dayMeals.forEach((meal, idx) => {
    parseSteps(meal.morning).forEach((_, sIdx) => {
      const id = stepId(day, idx, 'morning', sIdx);
      total++;
      if (doneSteps[id]) done++;
    });
  });
  // Count evening prep steps (collated)
  const evePrepData = EVE_PREP[day];
  if (evePrepData) {
    evePrepData.sections.forEach((sec, secIdx) => {
      sec.items.forEach((_, itemIdx) => {
        const id = `eve_${day}_${secIdx}_${itemIdx}`;
        total++;
        if (doneSteps[id]) done++;
      });
    });
  }
  return { total, done };
}

function render() {
  if (activeView !== 'mealplan') return;
  renderDayTabs();
  renderMain();
}

function renderDayTabs() {
  const container = document.getElementById('dayTabs');
  container.innerHTML = DAYS.map(day => {
    const { total, done } = countStepsForDay(day);
    const pct = total > 0 ? Math.round(done/total*100) : 0;
    const badge = total > 0 ? ` (${pct}%)` : '';
    return `<button class="day-tab ${day === activeDay ? 'active' : ''}" 
              onclick="selectDay('${day}')">${day}${badge}</button>`;
  }).join('');
}

function renderMain() {
  const main = document.getElementById('main');
  const dayMeals = MEAL_DATA.filter(m => m.day === activeDay);
  const { total, done } = countStepsForDay(activeDay);
  const pct = total > 0 ? Math.round(done/total*100) : 0;
  const evePrepData = EVE_PREP[activeDay];

  let html = '';

  // Summary bar
  const morningCount = dayMeals.reduce((acc, m) => acc + parseSteps(m.morning).length, 0);
  const eveCount = evePrepData ? evePrepData.sections.reduce((acc,s) => acc + s.items.length, 0) : 0;

  html += `
    <div class="prep-summary">
      <div class="prep-label">📋 ${activeDay}'s Plan</div>
      <div class="prep-divider"></div>
      <div class="prep-stat"><div class="prep-stat-num">${morningCount}</div><div class="prep-stat-lbl">Morning Steps</div></div>
      <div class="prep-divider"></div>
      <div class="prep-stat"><div class="prep-stat-num">${eveCount}</div><div class="prep-stat-lbl">Tonight's Prep</div></div>
      <div class="prep-divider"></div>
      <div class="prep-stat"><div class="prep-stat-num">${done}/${total}</div><div class="prep-stat-lbl">Done</div></div>
      <div style="flex:1"></div>
      <button class="clear-btn" onclick="clearDaySteps()">Reset Day</button>
    </div>`;

  // Day title
  html += `
    <div class="day-title-bar">
      <div class="day-title">${activeDay}</div>
      <div class="day-subtitle">${dayMeals.length} meals • ${morningCount + eveCount} prep steps</div>
      <div class="progress-ring">
        <span>${pct}% complete</span>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>

  // ── SECTION LABEL: TODAY'S MEALS ──
  html += `<div class="section-heading"><span class="section-icon">🍽</span> Today's Meals
    <button class="expand-all-btn" onclick="expandAll()" style="margin-left:auto;margin-bottom:0;">Expand All</button>
  </div>`;

  // Meal cards (morning prep only)
  html += '<div class="meals-grid">';
  dayMeals.forEach((meal, idx) => {
    const type = getMealSlotType(meal.meal);
    const isOpen = openCards[`${activeDay}_${idx}`];
    const activeTab = activeCardTab[`${activeDay}_${idx}`] || 'prep';
    const morningStepsList = parseSteps(meal.morning);

    // ── SNACK CARD: special compact editable layout ──
    if (type === 'snack') {
      const snackKey = `snack_${activeDay}_${idx}`;
      const isMorning = meal.snack_type === 'morning' || meal.meal.includes('Morning');
      const isEvening = !isMorning;

      if (isMorning) {
        // Morning snack: nuts + fruit, two rows
        const savedNuts = snackEdits[snackKey + '_nuts'] || meal.kids.split('\n')[0].replace('🥜 ','');
        const savedFruit = snackEdits[snackKey + '_fruit'] || meal.kids.split('\n')[1]?.replace('🍎 ','') || '';
        html += `<div class="meal-card snack-card snack-morning" id="card_${activeDay}_${idx}">
          <div class="snack-header">
            <div>
              <div class="meal-time" style="color:#7B5EA7;">11:00 AM</div>
              <div class="meal-name">🥜 Kids Morning Snack</div>
            </div>
            <span class="snack-edit-badge morning-badge">editable</span>
          </div>
          <div class="snack-body">
            <div class="snack-row">
              <span class="snack-icon">🥜</span>
              <input class="snack-input morning-input" type="text" value="${escapeAttr(savedNuts)}"
                onchange="saveSnack('${snackKey}_nuts', this.value)"
                placeholder="nuts (e.g. 5 almonds + 1 walnut)" />
            </div>
            <div class="snack-row">
              <span class="snack-icon">🍎</span>
              <input class="snack-input morning-input" type="text" value="${escapeAttr(savedFruit)}"
                onchange="saveSnack('${snackKey}_fruit', this.value)"
                placeholder="fruit (e.g. banana slices)" />
            </div>
          </div>
        </div>`;
      } else {
        // Evening snack: single editable row
        const raw = meal.kids || '';
        const defaultVal = raw.replace('🪷 ','').replace('🥜 ','').replace('🍎 ','');
        const savedVal = snackEdits[snackKey + '_main'] || defaultVal;
        html += `<div class="meal-card snack-card snack-evening" id="card_${activeDay}_${idx}">
          <div class="snack-header">
            <div>
              <div class="meal-time" style="color:#2D6A4F;">5:00 PM</div>
              <div class="meal-name">🪷 Kids Evening Snack</div>
            </div>
            <span class="snack-edit-badge">editable</span>
          </div>
          <div class="snack-body">
            <div class="snack-row">
              <span class="snack-icon">🪷</span>
              <input class="snack-input" type="text" value="${escapeAttr(savedVal)}"
                onchange="saveSnack('${snackKey}_main', this.value)"
                placeholder="e.g. Makhana — 1 small bowl" />
            </div>
            <div class="snack-note">Kids dinner at 7 PM</div>
          </div>
        </div>`;
      }
      return;
    }

    html += `<div class="meal-card ${type} ${isOpen ? 'open' : ''}" id="card_${activeDay}_${idx}">`;

    // Card header
    html += `
      <div class="card-header" onclick="toggleCard('${activeDay}', ${idx})">
        <div>
          ${type === 'comfort' ? '<span class="badge badge-comfort">🌟 Comfort Night</span><br>' : ''}
          ${type === 'eat-out' ? '<span class="badge badge-eatout">🍽 Eat Out</span><br>' : ''}
          <div class="meal-time">${getMealTimeLabel(meal.meal)}</div>
          <div class="meal-name">${getMealDisplayName(meal.meal)}</div>
        </div>
        <div class="card-chevron">▾</div>
      </div>`;

    if (isOpen) {
      html += `<div class="card-body">`;
      html += `<div class="card-tabs">
        <button class="card-tab ${activeTab === 'dish' ? 'active' : ''}" onclick="switchTab('${activeDay}', ${idx}, 'dish')">🍽 Dish</button>
        <button class="card-tab ${activeTab === 'prep' ? 'active' : ''}" onclick="switchTab('${activeDay}', ${idx}, 'prep')">🌅 Morning Prep</button>
        <button class="card-tab ${activeTab === 'kids' ? 'active' : ''}" onclick="switchTab('${activeDay}', ${idx}, 'kids')">👶 Kids</button>
        ${meal.macros ? `<button class="card-tab nutrition-tab ${activeTab === 'nutrition' ? 'active' : ''}" onclick="switchTab('${activeDay}', ${idx}, 'nutrition')">📊 Nutrition</button>` : ''}
        ${meal.full_recipe ? `<button class="card-tab ${activeTab === 'fullrecipe' ? 'active' : ''}" onclick="switchTab('${activeDay}', ${idx}, 'fullrecipe')">📜 Full Recipe</button>` : ''}
      </div>`;

      // Dish tab
      html += `<div class="tab-panel ${activeTab === 'dish' ? 'active' : ''}">`;
      html += `<div class="dish-desc">${escapeHtml(meal.adult)}</div>`;
      if (meal.recipe_url && meal.recipe_url.startsWith('http')) {
        html += `<a href="${meal.recipe_url}" target="_blank" class="recipe-link">📖 ${meal.recipe_label || 'View Recipe'} ↗</a>`;
      }
      html += `</div>`;

      // Morning prep tab
      html += `<div class="tab-panel ${activeTab === 'prep' ? 'active' : ''}">`;
      if (morningStepsList.length > 0) {
        html += `<ul class="steps-list">`;
        morningStepsList.forEach((step, sIdx) => {
          const id = stepId(activeDay, idx, 'morning', sIdx);
          const isDone = doneSteps[id];
          const mins = extractTime(step);
          html += `<li class="step-item ${isDone ? 'done' : ''}" onclick="toggleStep('${id}')">
            <div class="step-num">${isDone ? '✓' : sIdx + 1}</div>
            <div style="flex:1">
              <div class="step-text">${escapeHtml(step)}</div>
              ${mins ? `<div class="timer-badge">⏱ ${mins} min</div>` : ''}
            </div>
          </li>`;
        });
        html += `</ul>`;
      } else {
        html += `<p class="no-steps">No morning prep needed — comes together while eating!</p>`;
      }
      html += `</div>`;

      // Kids tab
      html += `<div class="tab-panel ${activeTab === 'kids' ? 'active' : ''}">`;
      html += `<div class="kids-section"><div class="kids-label">👶 For the Kids</div><div>${escapeHtml(meal.kids)}</div></div>`;
      html += `</div>`;

      // Nutrition tab
      if (meal.macros) {
        const mx = meal.macros;
        const rdaPct = (val, rda) => Math.min(100, Math.round(val / rda * 100));
        const bar = (pct, color) => `<div class="nbar-bg"><div class="nbar-fill" style="width:${pct}%;background:${color}"></div></div>`;
        const row = (label, val, unit, rda, color, flag) => `
          <tr class="nrow">
            <td class="nlabel">${label}</td>
            <td class="nval">${val}<span class="nunit">${unit}</span></td>
            <td class="nbar-cell">${bar(rdaPct(val,rda), color)}</td>
            <td class="npct">${rdaPct(val,rda)}%${flag ? ' <span class="nflag">'+flag+'</span>' : ''}</td>
          </tr>`;
        html += `<div class="tab-panel ${activeTab === 'nutrition' ? 'active' : ''}">
          <div class="nutrition-panel">
            <div class="nutrition-disclaimer">📐 Per adult serving • ±15% estimated • <em>${escapeHtml(mx.note)}</em></div>
            <div class="nutri-section-label">Macronutrients</div>
            <table class="nutri-table">
              <thead><tr><th>Nutrient</th><th>Amount</th><th class="th-bar"></th><th>% RDA</th></tr></thead>
              <tbody>
                ${row('Calories', mx.kcal, ' kcal', 2000, '#E8820C', '')}
                ${row('Protein', mx.protein, 'g', 85, '#5B8C5A', '')}
                ${row('Carbohydrates', mx.carbs, 'g', 300, '#4A90D9', '')}
                ${row('Fat', mx.fat, 'g', 65, '#F5A623', '')}
                ${row('Fiber', mx.fiber, 'g', 30, '#7B5EA7', '')}
              </tbody>
            </table>
            <div class="nutri-section-label" style="margin-top:14px">Key Micronutrients</div>
            <table class="nutri-table">
              <thead><tr><th>Nutrient</th><th>Amount</th><th class="th-bar"></th><th>% RDA</th></tr></thead>
              <tbody>
                ${row('Iron', mx.iron, 'mg', 18, '#C0392B', '')}
                ${row('Calcium', mx.calcium, 'mg', 1000, '#2980B9', '')}
                ${row('Vitamin B12', mx.b12, 'mcg', 2.4, '#8E44AD', mx.b12 < 0.5 ? '⚠ plant meal' : '')}
                ${row('Zinc', mx.zinc, 'mg', 11, '#27AE60', '')}
                ${row('Vitamin C', mx.vitc, 'mg', 90, '#E74C3C', '')}
                ${row('Folate', mx.folate, 'mcg', 400, '#16A085', '')}
              </tbody>
            </table>
          </div>
        </div>`;
      }

      // Full Recipe tab
      if (meal.full_recipe) {
        const fr = meal.full_recipe;
        html += `<div class="tab-panel ${activeTab === 'fullrecipe' ? 'active' : ''}"><div class="recipe-panel">`;
        html += `<div class="recipe-panel-title">${escapeHtml(fr.title)}</div>`;
        if (fr.subtitle) html += `<div class="recipe-panel-subtitle">${escapeHtml(fr.subtitle)}</div>`;
        html += `<div class="recipe-meta">`;
        if (fr.serves) html += `<span class="recipe-meta-chip">👥 Serves ${escapeHtml(fr.serves)}</span>`;
        html += `</div>`;
        if (fr.description) html += `<div class="recipe-desc-text">${escapeHtml(fr.description)}</div>`;
        html += `<div class="recipe-section-label">Ingredients</div>`;
        fr.ingredient_groups.forEach(group => {
          const isOpt = group.group.toLowerCase().includes('optional');
          html += `<div class="ingredient-group ${isOpt ? 'optional-group' : ''}">`;
          html += `<div class="ingredient-group-name">${escapeHtml(group.group)}</div><ul class="ingredient-list">`;
          group.items.forEach(item => { html += `<li class="ingredient-item">${escapeHtml(item)}</li>`; });
          html += `</ul></div>`;
        });
        html += `<div class="recipe-section-label">Method</div><ol class="method-steps">`;
        fr.steps.forEach(step => {
          html += `<li class="method-step">
            <div class="method-step-num">${step.num}</div>
            <div class="method-step-content">
              <div class="method-step-title">${escapeHtml(step.title)}</div>
              <div class="method-step-text">${escapeHtml(step.text)}</div>
              ${step.timer ? `<div class="method-step-timer">⏱ ${step.timer} min</div>` : ''}
            </div></li>`;
        });
        html += `</ol>`;
        if (fr.texture_goal) html += `<div class="recipe-section-label">Texture Goal</div><div class="texture-box">${escapeHtml(fr.texture_goal)}</div>`;
        if (fr.serving_ideas && fr.serving_ideas.length) {
          html += `<div class="recipe-section-label">Serving Ideas</div><div class="serving-tags">`;
          fr.serving_ideas.forEach(s => { html += `<span class="serving-tag">${escapeHtml(s)}</span>`; });
          html += `</div>`;
        }
        html += `</div></div>`;
      }

      html += `</div>`; // card-body
    }
    html += `</div>`; // meal-card
  });
  html += '</div>'; // meals-grid

  // ── DAILY NUTRITION TOTALS ──
  const dayMealsWithMacros = dayMeals.filter(m => m.macros);
  if (dayMealsWithMacros.length > 0) {
    const tot = dayMealsWithMacros.reduce((acc, m) => {
      acc.kcal += m.macros.kcal; acc.protein += m.macros.protein;
      acc.carbs += m.macros.carbs; acc.fat += m.macros.fat; acc.fiber += m.macros.fiber;
      acc.iron += m.macros.iron; acc.calcium += m.macros.calcium; acc.b12 += m.macros.b12;
      return acc;
    }, {kcal:0,protein:0,carbs:0,fat:0,fiber:0,iron:0,calcium:0,b12:0});
    html += `
    <div class="section-heading" style="margin-top:28px;">
      <span class="section-icon">📊</span> Daily Nutrition Totals
      <button class="export-btn" onclick="exportToExcel()">⬇ Export to Excel</button>
    </div>
    <div class="daily-nutrition-bar">
      <div class="dn-chip"><div class="dn-val">${tot.kcal}</div><div class="dn-lbl">kcal</div></div>
      <div class="dn-divider"></div>
      <div class="dn-chip"><div class="dn-val">${tot.protein}g</div><div class="dn-lbl">Protein</div></div>
      <div class="dn-chip"><div class="dn-val">${tot.carbs}g</div><div class="dn-lbl">Carbs</div></div>
      <div class="dn-chip"><div class="dn-val">${tot.fat}g</div><div class="dn-lbl">Fat</div></div>
      <div class="dn-chip"><div class="dn-val">${tot.fiber}g</div><div class="dn-lbl">Fiber</div></div>
      <div class="dn-divider"></div>
      <div class="dn-chip micro"><div class="dn-val">${tot.iron.toFixed(1)}mg</div><div class="dn-lbl">Iron</div></div>
      <div class="dn-chip micro"><div class="dn-val">${tot.calcium}mg</div><div class="dn-lbl">Calcium</div></div>
      <div class="dn-chip micro ${tot.b12 < 1.5 ? 'dn-warn' : ''}"><div class="dn-val">${tot.b12.toFixed(1)}mcg</div><div class="dn-lbl">B12${tot.b12 < 1.5 ? ' ⚠' : ''}</div></div>
    </div>`;
  }

  // ── SECTION: TONIGHT'S PREP ──
  if (evePrepData) {
    const nextDay = evePrepData.forDay;
    html += `<div class="section-heading" style="margin-top:32px;">
      <span class="section-icon">🌙</span> Tonight's Prep
      <span class="section-for-label">→ for ${nextDay}</span>
    </div>`;

    html += `<div class="eve-prep-panel">`;
    evePrepData.sections.forEach((sec, secIdx) => {
      if (sec.items.length === 0) return; // skip empty sections like "no soaking needed"
      html += `<div class="eve-section">`;
      html += `<div class="eve-section-label"><span class="eve-icon">${sec.icon}</span>${escapeHtml(sec.label)}</div>`;
      html += `<ul class="steps-list">`;
      sec.items.forEach((item, itemIdx) => {
        const id = `eve_${activeDay}_${secIdx}_${itemIdx}`;
        const isDone = doneSteps[id];
        html += `<li class="step-item ${isDone ? 'done' : ''}" onclick="toggleEveStep('${id}')">
          <div class="step-num eve-step-num">${isDone ? '✓' : itemIdx + 1}</div>
          <div style="flex:1">
            <div class="step-text">${escapeHtml(item.text)}</div>
            <span class="eve-tag">${escapeHtml(item.tag)}</span>
          </div>
        </li>`;
      });
      html += `</ul></div>`;
    });
    html += `</div>`; // eve-prep-panel
  }

  main.innerHTML = html;
}

function escapeHtml(text) {
  return String(text || '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/\n/g,'<br>');
}

function selectDay(day) {
  activeDay = day;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleCard(day, idx) {
  const key = `${day}_${idx}`;
  openCards[key] = !openCards[key];
  if (openCards[key] && !activeCardTab[key]) {
    // default: if meal has morning prep show prep, else dish
    const meal = MEAL_DATA.filter(m => m.day === day)[idx];
    const hasMorning = parseSteps(meal.morning).length > 0;
    activeCardTab[key] = hasMorning ? 'prep' : 'dish';
  }
  renderMain();
}

function switchTab(day, idx, tab) {
  activeCardTab[`${day}_${idx}`] = tab;
  renderMain();
}

function toggleStep(id) {
  doneSteps[id] = !doneSteps[id];
  render();
}

function toggleEveStep(id) {
  doneSteps[id] = !doneSteps[id];
  render();
}

function clearDaySteps() {
  // Clear morning steps
  const dayMeals = MEAL_DATA.filter(m => m.day === activeDay);
  dayMeals.forEach((meal, idx) => {
    parseSteps(meal.morning).forEach((_, sIdx) => {
      delete doneSteps[stepId(activeDay, idx, 'morning', sIdx)];
    });
  });
  // Clear evening prep steps
  const evePrepData = EVE_PREP[activeDay];
  if (evePrepData) {
    evePrepData.sections.forEach((sec, secIdx) => {
      sec.items.forEach((_, itemIdx) => {
        delete doneSteps[`eve_${activeDay}_${secIdx}_${itemIdx}`];
      });
    });
  }
  render();
}

function saveSnack(key, value) {
  snackEdits[key] = value;
}

function exportToExcel() {
  // Build data rows for all days
  const rows = [];
  rows.push(['Day','Meal','Dish','Calories (kcal)','Protein (g)','Carbs (g)','Fat (g)','Fiber (g)','Iron (mg)','Calcium (mg)','Vitamin B12 (mcg)','Zinc (mg)','Vitamin C (mg)','Folate (mcg)','Notes']);
  DAYS.forEach(day => {
    MEAL_DATA.filter(m => m.day === day && m.macros).forEach(m => {
      const mx = m.macros;
      rows.push([
        day,
        getMealDisplayName(m.meal),
        mx.name,
        mx.kcal, mx.protein, mx.carbs, mx.fat, mx.fiber,
        mx.iron, mx.calcium, mx.b12, mx.zinc, mx.vitc, mx.folate,
        mx.note
      ]);
    });
    // Daily totals row
    const dayMx = MEAL_DATA.filter(m => m.day === day && m.macros);
    if (dayMx.length > 0) {
      const t = dayMx.reduce((a,m) => {
        a.kcal+=m.macros.kcal; a.pro+=m.macros.protein; a.carb+=m.macros.carbs;
        a.fat+=m.macros.fat; a.fib+=m.macros.fiber; a.fe+=m.macros.iron;
        a.ca+=m.macros.calcium; a.b12+=m.macros.b12; a.zn+=m.macros.zinc;
        a.vc+=m.macros.vitc; a.fol+=m.macros.folate; return a;
      }, {kcal:0,pro:0,carb:0,fat:0,fib:0,fe:0,ca:0,b12:0,zn:0,vc:0,fol:0});
      rows.push([day,'DAILY TOTAL','',t.kcal,t.pro,t.carb,t.fat,t.fib,
        +t.fe.toFixed(1),t.ca,+t.b12.toFixed(1),+t.zn.toFixed(1),t.vc,t.fol,'']);
      rows.push([]); // blank spacer
    }
  });

  // Use SheetJS
  const script = document.createElement('script');
  script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  script.onload = () => {
    const ws = XLSX.utils.aoa_to_sheet(rows);
    // Column widths
    ws['!cols'] = [14,16,38,14,12,12,12,12,10,12,16,10,12,12,40].map(w=>({wch:w}));
    // Style header row (bold)
    const range = XLSX.utils.decode_range(ws['!ref']);
    for (let c = range.s.c; c <= range.e.c; c++) {
      const hdr = XLSX.utils.encode_cell({r:0,c});
      if (!ws[hdr]) continue;
      ws[hdr].s = {font:{bold:true}, fill:{fgColor:{rgb:'FFE0C070'}}};
    }
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Nutrition');
    // Add RDA reference sheet
    const rdaRows = [
      ['Nutrient','RDA (adults)','Unit','Notes'],
      ['Calories','2000','kcal','General reference'],
      ['Protein','85','g','Higher end for active adults'],
      ['Carbohydrates','300','g',''],
      ['Fat','65','g',''],
      ['Fiber','30','g',''],
      ['Iron','18','mg','Higher for women'],
      ['Calcium','1000','mg',''],
      ['Vitamin B12','2.4','mcg','Supplement advised for plant-heavy diets'],
      ['Zinc','11','mg',''],
      ['Vitamin C','90','mg',''],
      ['Folate','400','mcg',''],
    ];
    const ws2 = XLSX.utils.aoa_to_sheet(rdaRows);
    ws2['!cols'] = [22,18,10,42].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb, ws2, 'RDA Reference');
    XLSX.writeFile(wb, 'PrepWise_Nutrition.xlsx');
  };
  document.head.appendChild(script);
}

function escapeAttr(text) {
  return String(text || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function expandAll() {
  const dayMeals = MEAL_DATA.filter(m => m.day === activeDay);
  dayMeals.forEach((meal, idx) => {
    if (getMealSlotType(meal.meal) === 'snack') return; // snack cards are always open
    const key = `${activeDay}_${idx}`;
    openCards[key] = true;
    if (!activeCardTab[key]) {
      const hasMorning = parseSteps(meal.morning).length > 0;
      activeCardTab[key] = hasMorning ? 'prep' : 'dish';
    }
  });
  renderMain();
}

// ── KITCHEN MODE ──
function openKitchenMode() {
  const overlay = document.getElementById('prepOverlay');
  const body = document.getElementById('overlayBody');
  const titleEl = document.getElementById('overlayTitle');

  titleEl.textContent = `🍳 Kitchen Mode — ${activeDay}`;

  const dayMeals = MEAL_DATA.filter(m => m.day === activeDay);
  const evePrepData = EVE_PREP[activeDay];
  const allItems = [];

  // Morning steps per meal
  const hasMorning = dayMeals.some(m => parseSteps(m.morning).length > 0);
  if (hasMorning) {
    allItems.push({ isHeader: true, header: '🌅 Morning Prep — for today\'s meals' });
    dayMeals.forEach((meal, mIdx) => {
      const steps = parseSteps(meal.morning);
      if (steps.length > 0) {
        allItems.push({ isSub: true, header: getMealTimeLabel(meal.meal) + ' ' + getMealDisplayName(meal.meal) });
        steps.forEach((step, sIdx) => {
          allItems.push({ text: step, id: stepId(activeDay, mIdx, 'morning', sIdx) });
        });
      }
    });
  }

  // Evening prep collated
  if (evePrepData) {
    allItems.push({ isHeader: true, header: `🌙 Tonight's Prep — for ${evePrepData.forDay}` });
    evePrepData.sections.forEach((sec, secIdx) => {
      if (sec.items.length === 0) return;
      allItems.push({ isSub: true, header: sec.icon + ' ' + sec.label });
      sec.items.forEach((item, itemIdx) => {
        allItems.push({ text: item.text, id: `eve_${activeDay}_${secIdx}_${itemIdx}`, tag: item.tag });
      });
    });
  }

  if (allItems.length === 0) {
    body.innerHTML = `<div style="color:rgba(253,248,242,0.5);text-align:center;padding:60px 0;font-size:18px;">No prep steps for ${activeDay}.</div>`;
  } else {
    let stepCount = 0;
    body.innerHTML = allItems.map(s => {
      if (s.isHeader) return `<div style="font-family:'Playfair Display',serif;color:var(--saffron);padding:28px 0 6px;font-size:15px;font-weight:700;border-top:1px solid rgba(232,130,12,0.15);margin-top:8px;">${s.header}</div>`;
      if (s.isSub) return `<div style="font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:rgba(253,248,242,0.35);padding:12px 0 4px;">${s.header}</div>`;
      const isDone = doneSteps[s.id];
      stepCount++;
      const n = stepCount;
      return `
        <div class="prep-mode-step ${isDone ? 'done' : ''}" onclick="toggleKitchenStep('${s.id}', this)">
          <div class="prep-mode-num">${isDone ? '✓' : n}</div>
          <div>
            <div class="prep-mode-text">${escapeHtml(s.text)}</div>
            ${s.tag ? `<span style="font-size:11px;color:rgba(232,130,12,0.5);font-weight:600;">${escapeHtml(s.tag)}</span>` : ''}
          </div>
        </div>`;
    }).join('');
  }

  overlay.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function toggleKitchenStep(id, el) {
  doneSteps[id] = !doneSteps[id];
  el.classList.toggle('done');
  const num = el.querySelector('.prep-mode-num');
  if (doneSteps[id]) {
    num.textContent = '✓';
  } else {
    // restore original number — re-render
    openKitchenMode();
    return;
  }
  renderDayTabs(); // update progress %
}

function closeKitchenMode() {
  document.getElementById('prepOverlay').classList.remove('show');
  document.body.style.overflow = '';
  render();
}

ing — use sharp peeler). Cut into 1-inch chunks. Boil in salted water 25-30 min until fork-tender. Drain, refrigerate.", "timer": 28}, {"num": 2, "title": "Temper aromatics", "text": "Heat oil. Add mustard seeds (let pop), curry leaves, cumin. Add onion, cook 5 min. Add ginger-garlic paste, turmeric, stir 1 min."}, {"num": 3, "title": "Build stew", "text": "Add coconut milk. Stir in chickpeas and boiled yucca. Simmer 10 min until flavours meld.", "timer": 10}, {"num": 4, "title": "Finish", "text": "Stir in spinach, wilt 2 min. Adjust salt. Squeeze lime over. Toddler: mash yucca and chickpeas in broth — becomes a smooth, mild porridge-like texture they love."}], "serving_ideas": ["Yucca boiled Sunday evening — just reheat stew and assemble", "Stew can be made entirely ahead", "Also excellent with taro root if yucca unavailable"], "macros": {"kcal": 490, "protein": 16, "carbs": 72, "fat": 16, "fiber": 14}}, {"id": "masala_base", "title": "Onion-Tomato Masala Base", "subtitle": "The Weekly Foundation — Make Every Sunday", "description": "The foundational curry base used in all 6 main dishes this week. Cook once on Sunday and it powers the whole week. Eliminates 25+ minutes of daily repetitive cooking.", "serves": "6 portions (~½ cup each)", "day": "Sunday", "meal": "Weekly Prep", "category": "foundations", "texture_goal": "Thick, deeply coloured paste — oil separating at the edges.", "ingredient_groups": [{"group": "Ingredients", "items": ["3 large onions, finely chopped", "4 medium tomatoes, chopped", "2 tbsp ginger-garlic paste", "1½ tsp cumin seeds", "1 tsp turmeric", "1½ tsp coriander powder", "1 tsp red chilli powder", "1 tsp garam masala", "1½ tsp salt", "3 tbsp neutral oil"]}], "steps": [{"num": 1, "title": "Build the onion base", "text": "Heat oil. Add cumin seeds — let crackle 30 sec. Add onions + pinch salt. Cook on medium-low, stirring occasionally, 12-15 min until deep golden. Don't rush — this long cooking builds the flavour.", "timer": 15}, {"num": 2, "title": "Add aromatics", "text": "Add ginger-garlic paste. Cook 2 min until raw smell disappears."}, {"num": 3, "title": "Bloom spices", "text": "Add turmeric, coriander powder, chilli powder. Stir 30-40 sec until fragrant and toasty."}, {"num": 4, "title": "Cook down tomatoes", "text": "Add chopped tomatoes. Cook uncovered 8-10 min, mashing with spoon, until completely broken down and oil separates from the sides.", "timer": 10}, {"num": 5, "title": "Finish and portion", "text": "Add garam masala, cook 1 min. Cool completely. Divide into 6 equal portions (~½ cup each) in labelled containers. Refrigerate."}], "serving_ideas": ["Used in: Palak Paneer · Bharta · Stuffed Capsicum · Keema · Egg Curry · Tikka Masala", "Freeze unused portions for next week", "The deeper the onion colour, the richer the masala"], "macros": null}, {"id": "ginger_garlic_paste", "title": "Ginger-Garlic Paste", "subtitle": "Fresh Batch Every Sunday", "description": "Fresh ginger and garlic blended into a smooth paste. Made once on Sunday, used in virtually every savoury dish all week. Incomparably better than store-bought.", "serves": "~¼ cup (enough for the week)", "day": "Sunday", "meal": "Weekly Prep", "category": "foundations", "texture_goal": "Completely smooth, uniform paste with no chunks.", "ingredient_groups": [{"group": "Ingredients", "items": ["1 full head garlic, peeled (about 10-12 cloves)", "3-inch knob fresh ginger, peeled and sliced", "1 tbsp neutral oil", "1 tbsp water", "Pinch of salt"]}], "steps": [{"num": 1, "title": "Blend", "text": "Add all ingredients to a small blender or food processor. Blend until completely smooth — about 1-2 min, scraping down sides as needed."}, {"num": 2, "title": "Store", "text": "Transfer to a small jar. Smooth the surface. Drizzle a thin layer of oil on top to create a seal that prevents oxidation. Refrigerate."}], "serving_ideas": ["Use 1 tsp per dish as baseline", "Freeze in ice cube trays for 1-month supply", "Oil seal on top is important — don't skip it"], "macros": null}, {"id": "roti_dough", "title": "Roti Dough", "subtitle": "Batch 1 (Mon night) · Batch 2 (Thu night)", "description": "The base dough for all rotis and parathas. Made twice a week — Batch 1 covers Tuesday-Thursday, Batch 2 covers Friday-Sunday. Pull from fridge 10 min before rolling.", "serves": "14-18 rotis per batch", "day": "Monday / Thursday", "meal": "Weekly Prep", "category": "foundations", "texture_goal": "Smooth, elastic, slightly tacky — springs back slowly when poked.", "ingredient_groups": [{"group": "Batch 1 (Monday — for Tue-Thu)", "items": ["3 cups whole wheat atta", "¾ tsp salt", "1 tbsp neutral oil", "~¾ cup warm water (add gradually)"]}, {"group": "Batch 2 (Thursday — for Fri-Sun)", "items": ["3½ cups whole wheat atta", "1 tsp salt", "1 tbsp neutral oil", "~¾ cup warm water", "Optional: 2 tbsp rolled oats or 1 tbsp ground flaxseed for Friday multigrain rotis"]}], "steps": [{"num": 1, "title": "Mix", "text": "Combine atta and salt. Add oil, rub in with fingertips until it resembles coarse breadcrumbs. Add warm water gradually — start with ½ cup, then add 1 tbsp at a time. Dough should come together without sticking."}, {"num": 2, "title": "Knead", "text": "Knead on a clean surface 8-10 min until smooth and elastic. The surface should feel soft. Poke it — it should spring back slowly.", "timer": 10}, {"num": 3, "title": "Store", "text": "Coat the dough ball with a thin layer of oil. Place in airtight container or wrap tightly in cling film. Refrigerate."}, {"num": 4, "title": "Use", "text": "Pull from fridge 10 min before rolling — cold dough tears. Roll thin on a dry surface. Cook on hot tawa 1-2 min per side until brown spots appear and it puffs."}], "serving_ideas": ["10-min temper time before rolling is non-negotiable", "For parathas: roll, add filling, fold, roll out again", "Can be frozen in individual balls up to 2 weeks", "If sticky after refrigeration, dust hands with dry atta when rolling"], "macros": null}, {"id": "romaine_roasted_sweet_potato_edamame_and", "title": "Romaine, Roasted Sweet Potato, Edamame & Tofu Salad", "subtitle": "with Lemon–Sesame Ginger Dressing", "description": "A satisfying, protein-rich salad with warm roasted sweet potato, golden tofu, and crisp romaine. The zesty sesame-ginger dressing ties it all together.", "serves": "2–3", "day": "Tuesday", "meal": "5:30 PM 🌿 Evening", "category": "salads", "texture_goal": "Crisp romaine base with warm, golden tofu and sweet potato chunks — contrasting textures with a bright, nutty dressing.", "ingredient_groups": [{"group": "Salad", "items": ["2–3 cups romaine lettuce, chopped", "1 medium sweet potato, peeled and cubed", "¾–1 cup shelled edamame, steamed", "200g firm tofu, cubed", "1 tbsp sesame seeds (toasted)", "1 tbsp olive oil (for roasting)", "½ tsp salt", "½ tsp paprika or cumin"]}, {"group": "Lemon–Sesame Ginger Dressing", "items": ["2 tbsp fresh lemon juice", "1 tbsp sesame oil", "1 tbsp olive oil", "1 tsp soy sauce or tamari", "1 tsp maple syrup or honey", "½ tsp grated ginger", "½ tsp Dijon mustard (optional)", "1–2 tbsp water (to thin)", "pinch black pepper"]}, {"group": "Optional Additions", "items": ["sliced avocado", "pickled onions", "chili flakes"]}], "steps": [{"num": 1, "title": "Roast the sweet potato", "text": "Preheat oven to 400°F / 200°C. Toss sweet potato cubes with olive oil, salt, and paprika. Roast 20–25 minutes until golden and tender.", "timer": 25}, {"num": 2, "title": "Cook the tofu", "text": "Pat tofu dry and cube. Heat a pan with 1 tsp oil. Cook tofu 6–8 minutes, turning until golden on all sides. Optional: add a splash of soy sauce for flavour.", "timer": 8}, {"num": 3, "title": "Prepare the vegetables", "text": "Chop romaine lettuce. Steam edamame for 3–4 minutes if frozen.", "timer": 4}, {"num": 4, "title": "Make the dressing", "text": "Shake all dressing ingredients together in a jar until smooth and emulsified."}, {"num": 5, "title": "Assemble", "text": "In a large bowl combine romaine, edamame, and cooked tofu. Add dressing and toss lightly. Gently fold in roasted sweet potato last to keep it intact."}, {"num": 6, "title": "Finish", "text": "Sprinkle with toasted sesame seeds. Add optional avocado, pickled onions, or chili flakes as desired."}], "serving_ideas": ["Serve immediately while sweet potato is still warm", "Works as a standalone dinner or alongside a light soup", "Pack tofu and sweet potato separately if meal-prepping"], "macros": {"name": "Romaine-Sweet Potato-Edamame-Tofu Salad + Beet-Banana Smoothie", "note": "200g tofu, 1 sweet potato, ¾ cup edamame, romaine, sesame + beet smoothie", "kcal": 480, "protein": 30, "carbs": 46, "fat": 20, "fiber": 12, "iron": 5.2, "calcium": 340, "b12": 0.0, "zinc": 3.4, "vitc": 52, "folate": 160}}, {"id": "smoky_baingan_chana_bharta", "title": "Smoky Baingan–Chana Bharta", "subtitle": "Dry, Dhaba-Style", "description": "A smoky, protein-rich bharta made with roasted eggplant and chickpeas. This version is dry and scoopable with roti rather than saucy. Optional yogurt or lemon can be added for tang.", "serves": "3–4", "day": "Wednesday", "meal": "1:30 PM 🥗 Lunch", "category": "salads", "texture_goal": "Smoky, chunky, dry enough to scoop with roti — similar to a bharta + chole mash.", "ingredient_groups": [{"group": "Main", "items": ["1 large eggplant (baingan)", "1–1½ cups cooked chickpeas", "1 medium onion, finely chopped", "1 tomato, finely chopped"]}, {"group": "Aromatics", "items": ["1 tbsp ginger, finely chopped", "3 cloves garlic, finely chopped", "1 green chili, finely chopped (optional)"]}, {"group": "Spices", "items": ["1 tsp cumin seeds", "1 tsp coriander powder", "½ tsp turmeric", "½–1 tsp red chili powder", "½ tsp garam masala", "salt to taste"]}, {"group": "Finishing Flavors", "items": ["½ tsp kasuri methi (crushed)", "2 tbsp cilantro, chopped", "1 tsp mustard oil (optional but authentic)"]}, {"group": "Optional Tang (choose one)", "items": ["1–2 tbsp yogurt", "squeeze of lemon juice"]}, {"group": "Optional Green Add-ins", "items": ["chopped spinach", "chopped methi (fenugreek) leaves", "finely chopped green bell pepper", "small handful fresh moringa leaves", "moringa powder (½ tsp)", "green peas"]}], "steps": [{"num": 1, "title": "Roast the eggplant", "text": "Roast whole eggplant over flame, broiler, or oven (425°F / 220°C) until skin is charred and flesh is soft. Cool → peel → roughly mash."}, {"num": 2, "title": "Cook the base", "text": "Heat 1½ tbsp oil in a pan. Add cumin seeds — when they crackle, add onion + pinch of salt. Cook until lightly golden."}, {"num": 3, "title": "Add aromatics", "text": "Add garlic, ginger, and green chili. Cook about 1 minute until fragrant."}, {"num": 4, "title": "Add spices and tomato", "text": "Add coriander powder, turmeric, and chili powder. Then add the tomato. Cook until tomatoes break down, mixture becomes thick and slightly dry, and oil begins to separate."}, {"num": 5, "title": "Add eggplant and chickpeas", "text": "Add mashed roasted eggplant and chickpeas. Mash about 25% of the chickpeas with the spoon. Cook uncovered 8–10 minutes until dry and cohesive. If using green add-ins, stir them in during this step.", "timer": 10}, {"num": 6, "title": "Finish", "text": "Add garam masala, kasuri methi, mustard oil (optional), and cilantro. Cook 1 minute.", "timer": 1}, {"num": 7, "title": "Optional tang", "text": "Finish with 1–2 tbsp yogurt (creamier) OR a squeeze of lemon juice (brighter)."}], "serving_ideas": ["Whole-wheat roti or paratha", "Wrap filling", "Savory toast topping", "Side with dal and salad"], "macros": {"name": "Smoky Baingan-Chana Bharta + quinoa + zucchini", "note": "1 large eggplant, 1½ cup chickpeas, ¾ cup quinoa, ½ zucchini", "kcal": 490, "protein": 22, "carbs": 68, "fat": 12, "fiber": 18, "iron": 5.8, "calcium": 110, "b12": 0.0, "zinc": 3.2, "vitc": 14, "folate": 220}}, {"id": "creamy_feta_caesar_style_salad", "title": "Creamy Feta Caesar-Style Salad", "subtitle": "with Feta Caesar Dressing, Roasted Chickpeas & Eggs", "description": "A lighter Caesar-style salad built on romaine and roasted chickpeas, dressed with a creamy feta dressing that's tangy, garlicky, and rich — no anchovies needed. Topped with boiled eggs and avocado for a complete dinner.", "serves": "2", "day": "Wednesday", "meal": "5:30 PM 🌿 Evening", "category": "salads", "texture_goal": "Creamy and tangy dressing coating crisp romaine, with crunchy chickpeas and croutons, softened by rich avocado and egg.", "ingredient_groups": [{"group": "Salad", "items": ["4 cups romaine lettuce, chopped", "¾ cup roasted chickpeas", "¾ cup croutons", "3 hard-boiled eggs, halved", "1 avocado, sliced", "extra Parmesan (optional)"]}, {"group": "Creamy Feta Caesar Dressing", "items": ["⅓ cup crumbled feta (from the brine)", "2 tbsp Greek yogurt", "2 tbsp olive oil", "1½ tbsp lemon juice", "1 tsp Dijon mustard", "1 small garlic clove, grated", "1 tsp feta brine", "fresh black pepper", "1–2 tbsp water (to thin)"]}, {"group": "Optional", "items": ["½ tsp lemon zest (if feta is very salty — balances beautifully)", "½ tsp honey (alternative balance)"]}], "steps": [{"num": 1, "title": "Make the dressing", "text": "Add feta, yogurt, lemon juice, Dijon, garlic, and olive oil to a bowl or blender. Blend or whisk until smooth and creamy. Add 1 tsp feta brine and black pepper. Thin with 1–2 tbsp water until pourable. Taste before adding salt — the feta usually provides enough."}, {"num": 2, "title": "Roast the chickpeas", "text": "Preheat oven to 400°F / 200°C. Toss chickpeas with 1 tsp olive oil, pinch salt, ½ tsp paprika or cumin. Roast 15–20 minutes until crisp.", "timer": 20}, {"num": 3, "title": "Boil the eggs", "text": "Boil eggs for 9–10 minutes for fully set yolks. Cool in ice water, peel, and halve.", "timer": 10}, {"num": 4, "title": "Assemble", "text": "Toss romaine and chickpeas with dressing. Add croutons and toss again lightly. Top with halved eggs and sliced avocado. Add optional Parmesan and a squeeze of lemon."}], "serving_ideas": ["Serve immediately after dressing for maximum crunch", "Make dressing up to 3 days ahead and refrigerate", "Roasted chickpeas can be done during lunch prep"], "macros": {"name": "Feta Caesar Salad (romaine, chickpeas, eggs, avocado) + Berry Smoothie", "note": "Romaine, ¾ cup chickpeas, 3 eggs, 1 avocado, feta dressing + berry-yogurt smoothie", "kcal": 540, "protein": 32, "carbs": 42, "fat": 28, "fiber": 14, "iron": 4.8, "calcium": 360, "b12": 1.8, "zinc": 3.2, "vitc": 48, "folate": 200}}, {"id": "romaine_avocado_and_roasted_chickpea_sal", "title": "Romaine, Avocado & Roasted Chickpea Salad", "subtitle": "with Lemon-Herb Dressing", "description": "A bright, fresh salad with crunchy roasted chickpeas, creamy avocado, and a simple herb-forward lemon dressing. Light but filling.", "serves": "2", "day": "Thursday", "meal": "5:30 PM 🌿 Evening", "category": "salads", "texture_goal": "Crisp romaine and crunchy chickpeas against creamy avocado, finished with a bright, herby lemon dressing.", "ingredient_groups": [{"group": "Salad", "items": ["4 cups romaine lettuce, chopped", "1 large avocado, diced or sliced", "¾ cup roasted chickpeas", "½ cup cucumber, diced", "¼ cup cherry tomatoes, halved", "3 tbsp feta cheese, crumbled (optional)", "2 tbsp toasted sunflower seeds or pumpkin seeds"]}, {"group": "Lemon-Herb Dressing", "items": ["2 tbsp olive oil", "1½ tbsp lemon juice", "1 tsp Dijon mustard", "½ tsp honey or maple syrup", "1 tbsp chopped parsley or dill", "½ small garlic clove, grated", "salt & black pepper"]}], "steps": [{"num": 1, "title": "Roast the chickpeas", "text": "Preheat oven to 400°F / 200°C. Toss ¾ cup cooked chickpeas with 1 tsp olive oil, pinch salt, and ½ tsp paprika or cumin. Roast 15–20 minutes until crisp. Protein contribution: ~10–12g.", "timer": 20}, {"num": 2, "title": "Make the dressing", "text": "Whisk together olive oil, lemon juice, Dijon, honey, parsley or dill, garlic, salt and pepper until emulsified."}, {"num": 3, "title": "Assemble", "text": "Add romaine, cucumber, tomatoes, and chickpeas to a large bowl. Toss with lemon-herb dressing. Gently fold in avocado last to keep it intact. Sprinkle feta and seeds on top."}], "serving_ideas": ["Dress just before serving to keep romaine crisp", "Roasted chickpeas can be made ahead and stored at room temp", "Add a poached egg on top for extra protein"], "macros": {"name": "Romaine-Avocado-Chickpea Salad with Lemon-Herb Dressing + Mango Smoothie", "note": "4 cups romaine, 1 avocado, ¾ cup chickpeas, cucumber, tomatoes, feta + mango smoothie", "kcal": 520, "protein": 22, "carbs": 48, "fat": 28, "fiber": 16, "iron": 4.2, "calcium": 260, "b12": 0.6, "zinc": 2.6, "vitc": 60, "folate": 180}}, {"id": "broccoli_crunch_dinner_bowl", "title": "Broccoli Crunch Dinner Bowl", "subtitle": "with Quinoa, Edamame & Eggs", "description": "A substantial crunch bowl built on a creamy yogurt-honey dressing. Raw broccoli, apple, walnuts, and cranberries sit on a quinoa base, topped with edamame and boiled eggs for serious protein.", "serves": "2", "day": "Friday", "meal": "5:30 PM 🌿 COMFORT EVENING ✨", "category": "salads", "texture_goal": "Crunchy raw broccoli and walnuts coated in a creamy tangy dressing, on fluffy quinoa — topped with soft egg and bright edamame.", "ingredient_groups": [{"group": "Quinoa Base", "items": ["1 cup quinoa, uncooked", "2 cups water", "½ tsp salt"]}, {"group": "Broccoli Salad", "items": ["3 cups broccoli florets, finely chopped", "1 apple, diced", "¼ cup dried cranberries", "¼ cup red onion, finely chopped", "¼ cup parsley, chopped", "⅓ cup walnuts, toasted"]}, {"group": "Protein", "items": ["1 cup shelled edamame, cooked", "3 eggs, boiled and halved"]}, {"group": "Creamy Honey-Yogurt Dressing", "items": ["3 tbsp Greek yogurt", "1 tbsp mayonnaise", "1 tbsp honey or maple syrup", "1½ tbsp apple cider vinegar", "1 tsp Dijon mustard (optional)", "salt & black pepper to taste"]}, {"group": "Optional Toppings", "items": ["sliced avocado", "feta cheese", "pumpkin seeds or extra walnuts", "squeeze of lemon"]}], "steps": [{"num": 1, "title": "Cook the quinoa", "text": "Rinse quinoa well. Bring quinoa, water, and salt to a boil. Cover and simmer 12–15 minutes. Turn off heat and rest 5 minutes, then fluff with a fork.", "timer": 15}, {"num": 2, "title": "Prepare the broccoli salad", "text": "In a large bowl combine chopped broccoli, diced apple, red onion, cranberries, parsley, and toasted walnuts."}, {"num": 3, "title": "Make the dressing", "text": "Whisk together Greek yogurt, mayonnaise, honey, apple cider vinegar, Dijon mustard (if using), salt and pepper until smooth. Toss with the broccoli mixture and let sit for 5+ minutes — the broccoli softens slightly and the flavours meld.", "timer": 5}, {"num": 4, "title": "Assemble the bowls", "text": "Divide quinoa between bowls. Top with broccoli salad, edamame, and halved boiled eggs. Add optional toppings as desired."}], "serving_ideas": ["Make-ahead: cook quinoa and eggs the night before", "Toss broccoli with dressing and refrigerate — flavours improve overnight", "Assemble bowls just before eating"], "macros": {"name": "Egg Curry + Broccoli Crunch Bowl (quinoa, edamame, eggs) + arugula side", "note": "2 boiled eggs in curry, toast, dal + broccoli/apple/walnut/edamame bowl on quinoa", "kcal": 620, "protein": 36, "carbs": 56, "fat": 24, "fiber": 16, "iron": 6.2, "calcium": 280, "b12": 2.4, "zinc": 4.0, "vitc": 80, "folate": 200}}, {"id": "thai_peanut_cucumber_and_bell_pepper_din", "title": "Thai Peanut Cucumber & Bell Pepper Dinner Bowl", "subtitle": "with Quinoa, Edamame & Eggs", "description": "A vibrant Thai-inspired dinner bowl with crunchy cucumbers, sweet mini peppers, creamy peanut dressing, and a quinoa base. Fresh, punchy, and deeply satisfying.", "serves": "2–2½", "day": "Saturday", "meal": "5:30 PM 🌿 Evening", "category": "salads", "texture_goal": "Crisp cucumber and pepper crunch against creamy peanut dressing — fresh, punchy, and satisfying on a fluffy quinoa base.", "ingredient_groups": [{"group": "Quinoa Base", "items": ["1 cup quinoa, uncooked", "2 cups water", "pinch salt"]}, {"group": "Crunchy Salad Base", "items": ["3–4 mini cucumbers, sliced", "8–10 mini sweet peppers, sliced", "¼ red onion, thinly sliced", "½ cup shredded carrots", "2 tbsp cilantro, chopped"]}, {"group": "Protein", "items": ["1 cup shelled edamame", "3 boiled eggs, halved", "200g crispy tofu cubes (optional upgrade)"]}, {"group": "Healthy Crunch", "items": ["¼ cup roasted peanuts or cashews", "1 tbsp toasted sesame seeds", "½ avocado, sliced"]}, {"group": "Thai Peanut Dressing", "items": ["3 tbsp natural peanut butter", "1½ tbsp lime juice", "1 tbsp soy sauce or tamari", "1 tsp sesame oil", "1 tsp honey or maple syrup", "1 tsp fresh grated ginger", "1 small garlic clove, grated", "2–4 tbsp warm water (to thin)"]}, {"group": "Optional Flavor Boost", "items": ["½ tsp chili crisp or chili paste", "everything-bagel seasoning", "extra lime squeeze"]}], "steps": [{"num": 1, "title": "Cook the quinoa", "text": "Rinse quinoa. Bring with water and salt to a boil, cover and simmer ~15 minutes. Rest 5 minutes off heat, then fluff.", "timer": 15}, {"num": 2, "title": "Make the peanut dressing", "text": "Whisk together peanut butter, lime juice, soy sauce, sesame oil, honey, ginger, and garlic. Add warm water 1 tbsp at a time until creamy and pourable. Add chili crisp if using."}, {"num": 3, "title": "Prep the vegetables", "text": "Slice cucumbers, peppers, and red onion. Shred carrots. Toss all vegetables and cilantro with a little dressing."}, {"num": 4, "title": "Assemble the bowls", "text": "Divide quinoa between bowls. Add the dressed salad mixture. Top with edamame, boiled eggs, peanuts, sesame seeds, and avocado. Drizzle remaining dressing over everything."}, {"num": 5, "title": "Optional finish", "text": "Sprinkle with everything-bagel seasoning, chili crisp, and an extra squeeze of lime for crunch and a spicy finish."}], "serving_ideas": ["Make-ahead: cook quinoa, boil eggs, mix dressing, chop vegetables — all the night before", "Keep salad undressed until serving so cucumbers stay crisp", "Crispy tofu adds another protein tier and great texture"], "macros": {"name": "Thai Peanut Bowl (cucumbers, peppers, edamame, eggs, quinoa) + Avocado-Mango Smoothie", "note": "Mini cucumbers, peppers, ¾ cup edamame, 3 eggs, quinoa, peanut dressing + smoothie", "kcal": 580, "protein": 32, "carbs": 58, "fat": 24, "fiber": 14, "iron": 4.6, "calcium": 220, "b12": 1.4, "zinc": 3.4, "vitc": 72, "folate": 170}}];
