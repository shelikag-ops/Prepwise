  { id: 'breakfasts', label: '☀ Breakfasts', color: '#E8820C' },
  { id: 'lunches', label: '🥗 Lunches', color: '#2D6A4F' },
  { id: 'salads', label: '🌿 Salads & Bowls', color: '#0B7A75' },
  { id: 'foundations', label: '🫙 Foundations', color: '#A0390A' }
];

// ── SWITCH VIEW ──
function switchView(v) {
  activeView = v;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  document.getElementById('dayTabs').style.display = (v === 'mealplan') ? 'flex' : 'none';
  if (v === 'mealplan') render();
  else if (v === 'prepguide') renderPrepGuide();
  else if (v === 'recipes') renderRecipes();
}

// ════════════════════════════════════════════════════════════════
// PREP GUIDE RENDER
// ════════════════════════════════════════════════════════════════
function renderPrepGuide() {
  const main = document.getElementById('main');
  const pg = PREP_GUIDE;

  const windowsHtml = pg.windows.map(w => `
    <div class="pg-window">
      <div class="pg-window-label">${w.label}</div>
      <div class="pg-window-title">${w.title}</div>
      <div class="pg-window-time">⏱ ${w.time} &nbsp;·&nbsp; ${w.desc}</div>
    </div>`).join('');

  let html = `
    <div class="pg-hero">
      <h1>Weekly Prep Guide</h1>
      <p>Everything you can make ahead and store safely for the week. These batch items power the daily cooking — each is used across multiple meals.</p>
      <div class="pg-windows">${windowsHtml}</div>
    </div>`;

  // ── Sunday section ──
  html += `<div class="pg-section">
    <div class="pg-section-title">☀ Sunday Evening Prep <span style="font-size:15px;color:var(--muted);font-family:'DM Sans',sans-serif;font-weight:400;">~75 min total</span></div>
    <div class="pg-section-desc">Do all of this before the week starts. Each item below keeps for 5-7 days and is used across multiple dishes.</div>
    <div class="pg-items">`;

  pg.sunday.forEach((item, idx) => {
    const tagHtml = item.usedIn.map(u => `<span class="pg-tag uses">${u}</span>`).join('');
    const metaHtml = Object.entries(item.meta).map(([k,v]) => `
      <div class="pg-meta-cell"><div class="pg-meta-label">${k}</div><div class="pg-meta-val">${v}</div></div>`).join('');

    // special content
    let bodyContent = '';
    if (item.smoothiePacks) {
      bodyContent += `<div class="pg-meta-grid">${metaHtml}</div>
        <table class="pg-smoothie-table">
          <tr><th>Day</th><th>Label</th><th>Pack contents (freeze)</th></tr>
          ${item.smoothiePacks.map(p => `<tr><td>${p.day}</td><td>${p.label}</td><td>${p.contents}</td></tr>`).join('')}
        </table>`;
    } else if (item.dressings) {
      bodyContent += `<div class="pg-meta-grid">${metaHtml}</div>`;
      item.dressings.forEach(d => {
        bodyContent += `<div style="margin-bottom:10px;padding:10px 14px;background:var(--saffron-light);border-left:3px solid var(--saffron);border-radius:0 6px 6px 0;">
          <div style="font-size:13px;font-weight:700;color:var(--saffron);margin-bottom:3px;">${d.day} · ${d.name} <span style="font-size:11px;color:var(--muted);font-weight:400;">(keeps ${d.keeps})</span></div>
          <div style="font-size:13px;color:var(--text);">${d.recipe}</div>
        </div>`;
      });
    } else {
      bodyContent += `<div class="pg-meta-grid">${metaHtml}</div>
        <div class="pg-steps">${item.steps.map((s,i) => `
          <div class="pg-step">
            <div class="pg-step-num">${i+1}</div>
            <div class="pg-step-text">${s}</div>
          </div>`).join('')}
        </div>`;
    }
    if (item.note) bodyContent += `<div style="margin-top:10px;font-size:12px;color:var(--muted);font-style:italic;padding:8px 12px;background:rgba(0,0,0,0.03);border-radius:6px;">💡 ${item.note}</div>`;

    html += `
      <div class="pg-card" id="pgcard_${idx}">
        <div class="pg-card-header" onclick="togglePgCard(${idx})">
          <div class="pg-card-num">${item.num}</div>
          <div class="pg-card-meta">
            <div class="pg-card-title">${item.title} <span style="font-size:12px;color:var(--muted);font-weight:400;">— ${item.time}</span></div>
            <div class="pg-card-tags">${tagHtml}</div>
          </div>
          <div class="pg-card-toggle">⌄</div>
        </div>
        <div class="pg-card-body">${bodyContent}</div>
      </div>`;
  });
  html += `</div></div>`;

  // ── Monday night ──
  const mon = pg.monday;
  html += `<div class="pg-section">
    <div class="pg-section-title">🌙 Monday Night <span style="font-size:15px;color:var(--muted);font-family:'DM Sans',sans-serif;font-weight:400;">${mon.time}</span></div>
    <div class="pg-section-desc">One quick task that sets up the first half of the week.</div>
    <div class="pg-card open" id="pgcard_mon">
      <div class="pg-card-header" onclick="togglePgCard('mon')">
        <div class="pg-card-num">→</div>
        <div class="pg-card-meta">
          <div class="pg-card-title">${mon.title}</div>
          <div class="pg-card-subtitle" style="margin-top:3px;">${mon.subtitle}</div>
        </div>
        <div class="pg-card-toggle">⌄</div>
      </div>
      <div class="pg-card-body">
        <div class="pg-meta-grid">${Object.entries(mon.meta).map(([k,v]) => `<div class="pg-meta-cell"><div class="pg-meta-label">${k}</div><div class="pg-meta-val">${v}</div></div>`).join('')}</div>
        <div class="pg-steps">${mon.steps.map((s,i) => `<div class="pg-step"><div class="pg-step-num">${i+1}</div><div class="pg-step-text">${s}</div></div>`).join('')}</div>
        <div style="margin-top:10px;font-size:12px;color:var(--muted);font-style:italic;padding:8px 12px;background:rgba(0,0,0,0.03);border-radius:6px;">💡 ${mon.note}</div>
      </div>
    </div>
  </div>`;

  // ── Thursday night ──
  const thu = pg.thursday;
  html += `<div class="pg-section">
    <div class="pg-section-title">🌙 Thursday Night <span style="font-size:15px;color:var(--muted);font-family:'DM Sans',sans-serif;font-weight:400;">${thu.time}</span></div>
    <div class="pg-section-desc">Second roti dough batch — powers the weekend.</div>
    <div class="pg-card" id="pgcard_thu">
      <div class="pg-card-header" onclick="togglePgCard('thu')">
        <div class="pg-card-num">→</div>
        <div class="pg-card-meta">
          <div class="pg-card-title">${thu.title}</div>
          <div class="pg-card-subtitle" style="margin-top:3px;">${thu.subtitle}</div>
        </div>
        <div class="pg-card-toggle">⌄</div>
      </div>
      <div class="pg-card-body">
        <div class="pg-meta-grid">${Object.entries(thu.meta).map(([k,v]) => `<div class="pg-meta-cell"><div class="pg-meta-label">${k}</div><div class="pg-meta-val">${v}</div></div>`).join('')}</div>
        <div class="pg-steps">${thu.steps.map((s,i) => `<div class="pg-step"><div class="pg-step-num">${i+1}</div><div class="pg-step-text">${s}</div></div>`).join('')}</div>
        <div style="margin-top:10px;font-size:12px;color:var(--muted);font-style:italic;padding:8px 12px;background:rgba(0,0,0,0.03);border-radius:6px;">💡 ${thu.note}</div>
      </div>
    </div>
  </div>`;

  // ── Rolling daily prep ──
  html += `<div class="pg-section">
    <div class="pg-section-title">🔄 Daily Rolling Prep <span style="font-size:15px;color:var(--muted);font-family:'DM Sans',sans-serif;font-weight:400;">can't be batched</span></div>
    <div class="pg-section-desc">These are done each evening or morning and can't be prepared in advance.</div>
    <div class="pg-rolling-grid">
      ${pg.rolling.map(r => `<div class="pg-rolling-card"><div class="pg-rolling-title">${r.title}</div><div class="pg-rolling-note">${r.note}</div></div>`).join('')}
    </div>
  </div>`;

  // ── Fridge reference ──
  html += `<div class="pg-section">
    <div class="pg-section-title">🧊 What's In Your Fridge After Sunday</div>
    <table class="pg-fridge-table">
      <tr><th>Container</th><th>Keeps until</th><th>Used for</th></tr>
      ${pg.fridge.map(r => `<tr><td>${r.container}</td><td>${r.keeps}</td><td>${r.usedFor}</td></tr>`).join('')}
    </table>
  </div>`;

  main.innerHTML = html;
}

function togglePgCard(id) {
  const card = document.getElementById(`pgcard_${id}`);
  if (card) card.classList.toggle('open');
}

// ════════════════════════════════════════════════════════════════
// RECIPE BOOK RENDER
// ════════════════════════════════════════════════════════════════
function renderRecipes() {
  const main = document.getElementById('main');
  if (!activeRecipeId && RECIPES.length > 0) activeRecipeId = RECIPES[0].id;

  // Build sidebar
  let sidebarHtml = '';
  RECIPE_CATEGORIES.forEach(cat => {
    const catRecipes = RECIPES.filter(r => r.category === cat.id);
    if (!catRecipes.length) return;
    sidebarHtml += `<div class="rb-sidebar-section">
      <div class="rb-sidebar-heading" style="color:${cat.color}">${cat.label}</div>
      ${catRecipes.map(r => `<button class="rb-sidebar-item ${r.id === activeRecipeId ? 'active' : ''}"
        onclick="selectRecipe('${r.id}')">${r.title}</button>`).join('')}
    </div>`;
  });

  // Build recipe content
  const recipe = RECIPES.find(r => r.id === activeRecipeId);
  const recipeHtml = recipe ? renderRecipeContent(recipe) : '<div class="rb-empty"><div class="rb-empty-icon">📖</div>Select a recipe from the sidebar</div>';

  main.innerHTML = `<div class="rb-wrap">
    <div class="rb-sidebar">${sidebarHtml}</div>
    <div class="rb-content" id="rbContent">${recipeHtml}</div>
  </div>`;
}

function selectRecipe(id) {
  activeRecipeId = id;
  renderRecipes();
  // Scroll content to top
  const el = document.getElementById('rbContent');
  if (el) el.scrollTop = 0;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderRecipeContent(r) {
  const isFoundation = r.category === 'foundations';
  const accentColor = isFoundation ? '#A0390A' : (r.category === 'salads' ? '#0B7A75' : (r.category === 'breakfasts' ? '#7B5EA7' : 'var(--green)'));

  let html = `<div class="${isFoundation ? 'rb-foundation' : ''}">`;
  html += `<div class="rb-week-tag">Week 1</div>`;
  html += `<div class="rb-recipe-title">${r.title}</div>`;
  if (r.subtitle) html += `<div class="rb-recipe-subtitle">${r.subtitle}</div>`;
  html += `<div class="rb-day-badge">${r.day} · ${r.meal.replace(/[^\x20-\x7E\u00A0-\uFFFF]/g, '').trim()}</div>`;
  if (r.description) html += `<div class="rb-desc">${r.description}</div>`;

  // Meta strip
  html += `<div class="rb-meta-strip">
    <div class="rb-chip"><span>Serves</span>${r.serves || '2 adults'}</div>`;
  if (r.texture_goal) html += `<div class="rb-chip"><span>Texture goal</span>${r.texture_goal}</div>`;
  html += `</div>`;

  // Macros
  if (r.macros && r.macros.kcal) {
    const m = r.macros;
    html += `<div class="rb-macro-bar">
      <div class="rb-macro-chip"><div class="rb-macro-icon">🔥</div><div class="rb-macro-val">${m.kcal}</div><div class="rb-macro-label">kcal</div></div>
      <div class="rb-macro-chip"><div class="rb-macro-icon">🥩</div><div class="rb-macro-val">${m.protein}g</div><div class="rb-macro-label">protein</div></div>
      <div class="rb-macro-chip"><div class="rb-macro-icon">🌾</div><div class="rb-macro-val">${m.carbs}g</div><div class="rb-macro-label">carbs</div></div>
      <div class="rb-macro-chip"><div class="rb-macro-icon">🫒</div><div class="rb-macro-val">${m.fat}g</div><div class="rb-macro-label">fat</div></div>
      <div class="rb-macro-chip"><div class="rb-macro-icon">🌿</div><div class="rb-macro-val">${m.fiber}g</div><div class="rb-macro-label">fiber</div></div>
    </div>`;
  }

  // Ingredients
  if (r.ingredient_groups && r.ingredient_groups.length) {
    html += `<div class="rb-section-label" style="color:${accentColor};border-bottom-color:${accentColor};">Ingredients</div>`;
    r.ingredient_groups.forEach(g => {
      html += `<div class="rb-ingredient-group">
        <div class="rb-ig-name">${g.group}</div>
        <ul class="rb-ig-list">${g.items.map(i => `<li>${i}</li>`).join('')}</ul>
      </div>`;
    });
  }

  // Steps
  if (r.steps && r.steps.length) {
    html += `<div class="rb-section-label">Method</div><div class="rb-steps">`;
    r.steps.forEach(s => {
      html += `<div class="rb-step">
        <div class="rb-step-num">${s.num || ''}</div>
        <div class="rb-step-body">
          <div class="rb-step-title">${s.title}${s.timer ? `<span class="rb-step-timer">⏱ ${s.timer} min</span>` : ''}</div>
          <div class="rb-step-text">${s.text}</div>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  // Serving ideas
  if (r.serving_ideas && r.serving_ideas.length) {
    html += `<div class="rb-serving">
      <div class="rb-serving-title">Serving Ideas & Notes</div>
      <ul>${r.serving_ideas.map(s => `<li>${s}</li>`).join('')}</ul>
    </div>`;
  }

  html += `</div>`;
  return html;
}

// ── INIT ──
// Auto-select today if possible
const TODAY = new Date().toLocaleDateString('en-US', { weekday: 'long' });
if (DAYS.includes(TODAY)) activeDay = TODAY;

// Auto-open all breakfast/lunch cards with prep steps
MEAL_DATA.filter(m => m.day === activeDay).forEach((meal, idx) => {
  const key = `${activeDay}_${idx}`;
  const hasMorning = parseSteps(meal.morning).length > 0;
  if (hasMorning) {
    openCards[key] = true;
    activeCardTab[key] = 'prep';
  }
});

render();
</script>

</html>
